name: Load Tests

on:
  pull_request:
    paths:
      - 'qunarly-backend/**'
      - 'tests/**'
      - '.github/workflows/load-test.yml'
  schedule:
    - cron: '0 2 * * *'

jobs:
  smoke:
    name: Smoke Load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qunarly-backend/package-lock.json

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Start Postgres
        run: |
          cd qunarly-backend && docker-compose up -d postgres
          sleep 5

      - name: Install deps & migrate
        run: |
          cd qunarly-backend && npm ci && npx prisma migrate deploy

      - name: Seed load data
        id: seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qunarly
        run: |
          cd qunarly-backend
          OUTPUT=$(npm run load:seed 2>&1)
          echo "$OUTPUT"
          ROUTE_ID=$(echo "$OUTPUT" | grep ROUTE_ID= | sed 's/.*ROUTE_ID=//')
          echo "route_id=$ROUTE_ID" >> $GITHUB_OUTPUT

      - name: Start app
        run: |
          cd qunarly-backend && npm run build && npm run start &
          sleep 10

      - name: Run k6 smoke
        run: |
          cd qunarly-backend && mkdir -p artifacts && k6 run tests/load/scenarios/smoke.js --out json=artifacts/k6-smoke.json
        env:
          BASE_URL: http://localhost:3000
          ROUTE_ID: ${{ steps.seed.outputs.route_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-report
          path: qunarly-backend/artifacts/
